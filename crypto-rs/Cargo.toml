[package]
name = "crypto-rs"
version = "0.16.1"
edition = "2021"

[lib]
name = "blocknet_crypto"
crate-type = ["cdylib", "staticlib"]

[dependencies]
curve25519-dalek = "4.1"
ed25519-dalek = "2.1"
rand = "0.8"
sha2 = "0.10"
blake2 = "0.10"
bulletproofs = "5.0"
merlin = "3.0"
argon2 = "0.5"
blocknet-pow-kernel = { git = "https://github.com/zpalmtree/seine.git", rev = "8f9b5a9eb24d5f9cc55439e73b5d3298841a56bd" }

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
